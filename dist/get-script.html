<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Script — Permeable Scripts</title>
  <style>
    :root { --ink:#092432; --paper:#f6f4ed; --mint:#b9f5d0; --line:#cbd9d7; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; padding:0 24px; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } nav { max-width:1180px; height:76px; margin:auto; display:flex; align-items:center; border-bottom:1px solid var(--line); } .brand { display:flex; align-items:center; gap:10px; color:var(--ink); font-size:22px; font-weight:850; letter-spacing:-.05em; text-decoration:none; } .brand img { width:42px; height:42px; object-fit:contain; }
    .panel { width:min(100%,560px); margin:56px auto 40px; padding:42px; background:#fffefa; border:1px solid var(--line); border-radius:20px; box-shadow:12px 12px 0 var(--mint); text-align:center; }
    .back { display:inline-block; margin-bottom:26px; color:#087f72; text-decoration:none; font-weight:800; font-size:14px; } h1 { margin:0; font-size:clamp(36px,6vw,56px); letter-spacing:-.06em; line-height:.95; } p { color:#57717b; line-height:1.5; margin:18px auto 30px; max-width:410px; }
    .key-form { display:grid; gap:12px; } input { width:100%; border:1px solid var(--line); border-radius:11px; padding:16px; background:white; color:var(--ink); font:16px inherit; } button { border:1px solid var(--ink); border-radius:11px; padding:16px 18px; background:white; color:var(--ink); font:800 16px inherit; cursor:pointer; } button:hover { transform:translateY(-2px); box-shadow:0 4px 0 var(--ink); } .help { margin-top:24px; font-size:14px; } .help a { color:#087f72; font-weight:800; }
  </style>
</head>
<body>
  <nav><a class="brand" href="index.html"><img src="permeable-logo-dark.png" alt="Permeable Scripts logo" /> Permeable Scripts</a></nav>
  <main class="panel">
    <a class="back" href="index.html">← Back to scripts</a>
    <h1>Enter Key</h1>
    <p>Enter your access key to get the script.</p>
    <form class="key-form">
      <input type="text" placeholder="Enter key" aria-label="Enter key" />
      <button type="submit">Get script</button>
    </form>
    <p class="help">To get a key, DM Dinklestinkle on <a href="https://discord.gg/msb4k993wU" target="_blank" rel="noreferrer">Discord</a>.</p>
  </main>
  <script>
    document.querySelector('.key-form').addEventListener('submit', event => event.preventDefault());
  </script>
</body>
</html>
