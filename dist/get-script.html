<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Script — Permeable Scripts</title>
  <style>
    :root { --ink:#092432; --paper:#f6f4ed; --mint:#b9f5d0; --line:#cbd9d7; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .panel { width:min(100%,560px); padding:42px; background:#fffefa; border:1px solid var(--line); border-radius:20px; box-shadow:12px 12px 0 var(--mint); text-align:center; }
    .back { display:inline-block; margin-bottom:26px; color:#087f72; text-decoration:none; font-weight:800; font-size:14px; } h1 { margin:0; font-size:clamp(36px,6vw,56px); letter-spacing:-.06em; line-height:.95; } p { color:#57717b; line-height:1.5; margin:18px auto 30px; max-width:410px; }
    .choices { display:grid; gap:12px; } button { border:1px solid var(--ink); border-radius:11px; padding:16px 18px; background:var(--mint); color:var(--ink); font:800 16px inherit; cursor:pointer; } button:hover { transform:translateY(-2px); box-shadow:0 4px 0 var(--ink); } button.alt { background:var(--ink); color:white; } #message { min-height:22px; margin:20px 0 0; color:#087f72; font-weight:750; font-size:14px; }
  </style>
</head>
<body>
  <main class="panel">
    <a class="back" href="index.html">← Back to scripts</a>
    <h1>Get Hollow Hub</h1>
    <p>Select how you’d like to pay. Payment setup will be connected here later.</p>
    <div class="choices">
      <button data-method="Brainrot">Pay with Brainrot</button>
      <button class="alt" data-method="Robux">Pay with Robux</button>
    </div>
    <div id="message" aria-live="polite"></div>
  </main>
  <script>
    document.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
      document.querySelector('#message').textContent = `${button.dataset.method} payment option selected — coming soon.`;
    }));
  </script>
</body>
</html>
