<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A curated library of Studio-ready Roblox Luau patterns." />
  <title>Permeable Scripts — Roblox script patterns</title>
  <style>
    :root { --ink:#092432; --muted:#57717b; --paper:#f6f4ed; --mint:#b9f5d0; --cyan:#41c6d9; --orange:#ff8a4c; --line:#cbd9d7; --card:#fffefa; }
    * { box-sizing:border-box } body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
    .shell { max-width:1180px; margin:auto; padding:0 28px; }
    nav { height:76px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:850; letter-spacing:-.05em; font-size:22px; } .brand-logo { width:42px; height:42px; object-fit:contain; }
    .nav-links { display:flex; gap:24px; font-size:14px; font-weight:700; } .nav-links a { color:var(--ink); text-decoration:none; }
    .hero { padding:84px 0 54px; display:grid; grid-template-columns:1.2fr .8fr; gap:32px; align-items:end; }
    .eyebrow { color:#087f72; text-transform:uppercase; font-size:12px; font-weight:850; letter-spacing:.12em; }
    h1 { font-size:clamp(48px,7vw,88px); line-height:.91; letter-spacing:-.07em; max-width:760px; margin:12px 0 24px; } h1 em { font-style:normal; color:#0c907e; }
    .intro { font-size:19px; line-height:1.5; max-width:560px; color:var(--muted); } .statbox { background:var(--ink); color:#e8fff3; padding:26px; border-radius:18px; transform:rotate(2deg); box-shadow:10px 10px 0 var(--mint); }
    .statbox strong { font-size:44px; letter-spacing:-.06em; display:block; } .statbox p { margin:4px 0 0; color:#a5c7c6; font-size:14px; }
    .page-title { margin:42px 0 10px; font-size:clamp(52px,8vw,96px); line-height:.9; letter-spacing:-.07em; } .controls { display:flex; justify-content:flex-end; align-items:center; gap:18px; margin:12px 0 26px; } .filters { display:flex; gap:8px; flex-wrap:wrap; }.filter { border:1px solid var(--line); color:var(--ink); background:transparent; border-radius:999px; padding:9px 14px; font:700 13px inherit; cursor:pointer; }.filter.active,.filter:hover { border-color:var(--ink); background:var(--mint); }
    .search { width:260px; border:1px solid var(--line); background:white; padding:11px 14px; border-radius:9px; color:var(--ink); font:inherit; }
    .library { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; padding-bottom:72px; }.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; min-height:255px; display:flex; flex-direction:column; transition:transform .2s, box-shadow .2s; }.card:hover { transform:translateY(-5px); box-shadow:0 10px 0 var(--mint); }.tag { align-self:flex-start; border-radius:999px; padding:5px 9px; font-size:11px; font-weight:800; background:var(--mint); color:#087f72; }.preview { width:100%; height:150px; object-fit:contain; margin:14px 0 2px; border-radius:10px; background:#071314; }.card h2 { font-size:23px; letter-spacing:-.04em; margin:18px 0 8px; }.card p { margin:0; color:var(--muted); line-height:1.45; font-size:14px; }.meta { margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:20px; font-size:12px; font-weight:750; color:#54717a; }.copy { border:0; background:var(--ink); color:white; padding:8px 11px; border-radius:7px; cursor:pointer; font:800 12px inherit; }.copy:hover { background:#087f72; }
    .note { border-top:1px solid var(--line); padding:28px 0 42px; color:var(--muted); font-size:13px; }.note b { color:var(--ink); }
    @media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:56px}.statbox{max-width:340px}.library{grid-template-columns:1fr 1fr}.controls{align-items:flex-start;flex-direction:column}.search{width:100%}} @media(max-width:520px){.shell{padding:0 18px}.nav-links{display:none}.library{grid-template-columns:1fr}h1{font-size:55px}}
  </style>
</head>
<body>
  <main class="shell">
    <nav><div class="brand"><img class="brand-logo" src="permeable-logo-dark.png" alt="Permeable Scripts logo" /> Permeable Scripts</div></nav>
    <section id="library"><h1 class="page-title">Scripts</h1><div class="controls"><input class="search" id="search" placeholder="Search scripts…" aria-label="Search scripts" /></div><div class="library" id="cards"></div></section>
    <footer class="note" id="how"><b>Use responsibly.</b> These snippets are intended for experiences you own or have permission to edit. Paste each script into the indicated Roblox Studio location, then tailor it to your game.</footer>
  </main>
  <script>
    const scripts = [
      {name:'Hollow Hub 🎃 [Steal A Brainrot]',place:'StarterGui / LocalScript',image:'hollow-hub-preview.png',desc:'A Steal a Brainrot–inspired hub preview for building a brainrot-sniper style interface in an experience you own.',code:`local UIS = game:GetService("UserInputService")\nlocal hub = script.Parent:WaitForChild("HubPanel")\nhub.Visible = false\nUIS.InputBegan:Connect(function(input, processed)\n  if not processed and input.KeyCode == Enum.KeyCode.H then\n    hub.Visible = not hub.Visible\n  end\nend)`},
      {name:'Proximity Door',place:'ServerScriptService',desc:'Open a tagged door when a player gets close, with a compact debounce pattern.',code:`local TweenService = game:GetService("TweenService")\nlocal door = workspace.Door\nlocal prompt = door.ProximityPrompt\nprompt.Triggered:Connect(function()\n  TweenService:Create(door, TweenInfo.new(.4), {CFrame = door.CFrame * CFrame.new(0, 8, 0)}):Play()\nend)`},
      {name:'Coins Leaderboard',place:'ServerScriptService',desc:'Create a simple Coins stat that appears in Roblox’s built-in player list.',code:`game.Players.PlayerAdded:Connect(function(player)\n  local stats = Instance.new("Folder")\n  stats.Name = "leaderstats"\n  stats.Parent = player\n  local coins = Instance.new("IntValue")\n  coins.Name, coins.Value = "Coins", 0\n  coins.Parent = stats\nend)`},
      {name:'Toast Notification',place:'StarterGui / LocalScript',desc:'Animate a message panel in and out using TweenService.',code:`local TweenService = game:GetService("TweenService")\nlocal panel = script.Parent.Toast\npanel.Position = UDim2.fromScale(.5, -0.2)\nTweenService:Create(panel, TweenInfo.new(.35), {Position = UDim2.fromScale(.5, .1)}):Play()\ntask.wait(3)\nTweenService:Create(panel, TweenInfo.new(.3), {Position = UDim2.fromScale(.5, -0.2)}):Play()`},
      {name:'Sprint Toggle',place:'StarterPlayerScripts',desc:'Hold Left Shift to temporarily increase WalkSpeed, then safely restore it.',code:`local UIS = game:GetService("UserInputService")\nlocal hum = script.Parent:WaitForChild("Humanoid")\nUIS.InputBegan:Connect(function(i)\n  if i.KeyCode == Enum.KeyCode.LeftShift then hum.WalkSpeed = 24 end\nend)\nUIS.InputEnded:Connect(function(i)\n  if i.KeyCode == Enum.KeyCode.LeftShift then hum.WalkSpeed = 16 end\nend)`},
      {name:'Random Spawn',place:'ServerScriptService',desc:'Move a character to one of several spawn parts after their character loads.',code:`local spawns = workspace.SpawnPoints:GetChildren()\ngame.Players.PlayerAdded:Connect(function(player)\n  player.CharacterAdded:Connect(function(char)\n    char:PivotTo(spawns[math.random(#spawns)].CFrame + Vector3.new(0, 4, 0))\n  end)\nend)`},
      {name:'Click Counter',place:'StarterGui / LocalScript',desc:'Wire up a text button and keep a visible click total for your UI prototype.',code:`local button = script.Parent.TextButton\nlocal count = 0\nbutton.Activated:Connect(function()\n  count += 1\n  button.Text = "Clicks: " .. count\nend)`}
    ];
    const cards = document.querySelector('#cards'), search = document.querySelector('#search');
    function render(){const term=search.value.toLowerCase(); cards.innerHTML=''; scripts.filter(s=>`${s.name} ${s.desc}`.toLowerCase().includes(term)).forEach(s=>{const el=document.createElement('article'); el.className='card'; const preview=s.image?`<img class="preview" src="${s.image}" alt="${s.name} preview" />`:''; el.innerHTML=`<span class="tag">Steal A Brainrot</span>${preview}<h2>${s.name}</h2><p>${s.desc}</p><div class="meta"><button class="copy">Get script</button></div>`;el.querySelector('button').onclick=async()=>{await navigator.clipboard.writeText(s.code);el.querySelector('button').textContent='Got it!';setTimeout(()=>el.querySelector('button').textContent='Get script',1100)};cards.appendChild(el)});}
    search.oninput=render;render();
  </script>
</body></html>
