<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Info — Permeable Scripts</title>
  <style>
    :root { --ink:#092432; --paper:#f6f4ed; --mint:#b9f5d0; --line:#cbd9d7; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .panel { width:min(100%,560px); padding:42px; background:#fffefa; border:1px solid var(--line); border-radius:20px; box-shadow:12px 12px 0 var(--mint); text-align:center; }
    .back { display:inline-block; margin-bottom:26px; color:#087f72; text-decoration:none; font-weight:800; font-size:14px; } h1 { margin:0; font-size:clamp(36px,6vw,56px); letter-spacing:-.06em; line-height:.95; } p { color:#57717b; line-height:1.5; margin:18px auto 28px; max-width:410px; } .method { color:#087f72; font-weight:800; } .discord { display:inline-block; border:1px solid var(--ink); border-radius:11px; padding:15px 20px; background:white; color:var(--ink); text-decoration:none; font-weight:800; } .discord:hover { transform:translateY(-2px); box-shadow:0 4px 0 var(--ink); }
  </style>
</head>
<body>
  <main class="panel">
    <a class="back" href="get-script.html">← Back to choices</a>
    <h1>Payment Info</h1>
    <p>Selected: <span class="method" id="method">Payment option</span>.</p>
    <p>Join the Discord, then direct message <b>Dinklestinkle</b> to pay.</p>
    <a class="discord" href="https://discord.gg/msb4k993wU" target="_blank" rel="noreferrer">Join the Discord</a>
  </main>
  <script>
    const selected = new URLSearchParams(location.search).get('method');
    if (selected) document.querySelector('#method').textContent = selected;
  </script>
</body>
</html>
